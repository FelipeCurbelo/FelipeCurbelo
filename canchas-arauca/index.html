<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0C1310" />
  <meta name="description" content="Kancha: encuentra, reserva y paga las mejores canchas sintéticas y de futsal de Arauca." />
  <title>Kancha · Canchas de Arauca</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A0D0B'/%3E%3Cg fill='none' stroke='%23C8F04E' stroke-width='6'%3E%3Crect x='20' y='30' width='60' height='40' rx='5'/%3E%3Cline x1='50' y1='30' x2='50' y2='70'/%3E%3Ccircle cx='50' cy='50' r='11'/%3E%3C/g%3E%3Ccircle cx='50' cy='50' r='4' fill='%23C8F04E'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <!-- Tipografías e iconos de la marca (vendorizados, sin CDN) -->
  <link rel="stylesheet" href="vendor/fonts/fonts.css" />
  <!-- Leaflet (vendorizado, sin CDN) -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="kroot">
    <!-- ===== MAPA (capa base, siempre montada) ===== -->
    <div id="kmap"></div>

    <!-- Degradados del mapa -->
    <div class="map-fade top" id="mapFadeTop"></div>
    <div class="map-fade bottom" id="mapFadeBottom"></div>

    <!-- ===== CHROME SUPERIOR (mapa + lista) ===== -->
    <div id="chrome" class="chrome"></div>

    <!-- ===== RAIL DE TARJETAS (mapa) ===== -->
    <div id="rail" class="rail khs"></div>

    <!-- ===== VISTA LISTA ===== -->
    <div id="screenLista" class="screen-scroll khs hidden"></div>

    <!-- ===== VISTA RESERVAS ===== -->
    <div id="screenReservas" class="screen-scroll khs hidden"></div>

    <!-- ===== TAB BAR ===== -->
    <div id="tabbar" class="tabbar hidden"></div>

    <!-- ===== OVERLAY: DETALLE ===== -->
    <div id="detail" class="overlay hidden"></div>

    <!-- ===== OVERLAY: PAGO ===== -->
    <div id="pay" class="overlay hidden"></div>

    <!-- ===== OVERLAY: CONFIRMACIÓN ===== -->
    <div id="confirm" class="overlay hidden"></div>

    <!-- ===== ONBOARDING ===== -->
    <div id="onboarding" class="overlay"></div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
